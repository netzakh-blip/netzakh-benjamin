const enMarriage=paraHas(enArt,'Benjamin married Natalie St. Martin');if(enMarriage)enMarriage.after(card('Field note · Creole, colour, and slaveholding','Benjamin was <strong>not legally classified as a person of colour</strong> in antebellum Louisiana. His Sephardic Jewish origins marked him as ethnoreligiously different, and antisemitism could make the boundaries of whiteness conditional, but Louisiana admitted him to the white political order: attorney, planter, legislator, senator. Natalie St. Martin likewise came from a French Catholic Creole family; “Creole” did not mean “person of colour,” and the surviving records do not establish her as a free woman of colour. Her marriage settlement nevertheless brought Benjamin cash and two enslaved girls.<br><br>The larger Louisiana context is stranger and more revealing. New Orleans possessed a substantial class of <strong>free people of colour</strong>, and some became property owners, planters, and slaveholders. LSU documents figures such as Andrew Durnford, a free man of colour, sugar planter, and slaveholder, as well as the Metoyer family of Natchitoches, who held significant enslaved property. Some purchases involved kin trapped inside restrictive manumission law; others plainly served household or commercial labour. Louisiana’s three-tiered legal world allowed property and status to cross the colour line while denying equal citizenship.','Sources: <a href="https://64parishes.org/entry/judah-p-benjamin-2" target="_blank" rel="noopener">64 Parishes, “Judah P. Benjamin”</a>; <a href="https://lib.lsu.edu/sites/all/files/sc/fpoc/history.html" target="_blank" rel="noopener">LSU Special Collections, “Free People of Color in Louisiana”</a>; <a href="https://repository.lsu.edu/gradschool_theses/3013/" target="_blank" rel="noopener">Anne Ulentin, “Free Women of Color and Slaveholding in New Orleans”</a>.','en'));
const heMarriage=paraHas(heArt,'בנימין נישא ב־1833 לנטלי סן מרטן');if(heMarriage)heMarriage.after(card('הערת שדה · קריאוליות, צבע ועבדות','בנימין <strong>לא סווג מבחינה משפטית כאדם צבעוני</strong> בלואיזיאנה שלפני מלחמת האזרחים. מוצאו היהודי־ספרדי סימן אותו כשונה מבחינה דתית ואתנית, ואנטישמיות יכלה להפוך את גבולות הלבנוּת למותנים, אבל לואיזיאנה קיבלה אותו לתוך הסדר הפוליטי הלבן: עורך דין, בעל מטע, מחוקק וסנאטור. גם נטלי סן־מרטן באה ממשפחה קריאולית צרפתית־קתולית; “קריאולי” לא היה שם נרדף ל“אדם צבעוני”, והמקורות ששרדו אינם מבססים שהיא הייתה אישה חופשית של צבע. עם זאת, הסכם הנישואין שלה הביא לבנימין כסף ושתי נערות משועבדות.<br><br>ההקשר הרחב של לואיזיאנה מורכב יותר. בניו אורלינס התקיימה שכבה גדולה של <strong>בני־צבע חופשיים</strong>, וחלקם היו בעלי רכוש, בעלי מטעים ואף בעלי עבדים. אוספי LSU מתעדים, בין השאר, את אנדרו דורנפורד, בן־צבע חופשי שהיה בעל מטע סוכר ובעל עבדים, ואת משפחת מטויה מנאצ׳יטוש, שהחזיקה רכוש משועבד ניכר. חלק מן הרכישות נגעו לקרובי משפחה שנלכדו בתוך דיני שחרור מגבילים; אחרות שירתו עבודה ביתית או מסחרית. העולם המשפטי התלת־שכבתי של לואיזיאנה אפשר לרכוש ולמעמד לחצות לעיתים את קו הצבע, בלי להעניק שוויון אזרחי.','מקורות: <a href="https://64parishes.org/entry/judah-p-benjamin-2" target="_blank" rel="noopener">64 Parishes</a>; <a href="https://lib.lsu.edu/sites/all/files/sc/fpoc/history.html" target="_blank" rel="noopener">LSU Special Collections</a>; <a href="https://repository.lsu.edu/gradschool_theses/3013/" target="_blank" rel="noopener">Anne Ulentin</a>.','he'));
function warNotes(article,lang){if(!article)return;const sid=lang==='he'?'he-jewish-americans-in-a-divided-war':'jewish-americans-in-a-divided-war';const fig=firstFigureAfter(doc.getElementById(sid));if(lang==='en'){if(fig)fig.after(card('Field note · A Yehudee in the line of fire','In 1862, <em>The Jewish Messenger</em> retold a story of a Dutch Jewish soldier at Waterloo who cried “Shma Israel” whenever he fired because “it may be some Yehudee gets killed by him.” Its circulation during the American Civil War reveals an imagined Jewish fraternity crossing battle lines.','<a href="https://sites.americanjewisharchives.org/publications/journal/PDF/1961_13_02_00.pdf" target="_blank" rel="noopener">American Jewish Archives reprint of <em>The Jewish Messenger</em>, 7 February 1862</a>.','en'));const p=paraHas(article,'The Jonas family illustrated');if(p)p.after(card('Field note · Thirty graves in Richmond','Richmond’s Hebrew Cemetery contains a separately enclosed Soldiers’ Section with thirty Jewish Confederate dead. The Hebrew Ladies’ Memorial Association began caring for the graves in 1866.','<a href="https://www.bethahabah.org/bama/hebrew-cemetery/" target="_blank" rel="noopener">Congregation Beth Ahabah</a>.','en'));const q=paraHas(article,'Southern Jewish worship also adapted');if(q)q.after(card('Field note · Lee and the High Holy Days','In 1861 Max Michelbacher asked Robert E. Lee for a general furlough for Jewish soldiers during the High Holy Days. Lee declined blanket leave but allowed individual applications. In 1863 L. Leon recorded a Lee order allowing each “Israelite” to go to Richmond for the holidays, adding dryly: “I did not care to go.”','<a href="https://www.shapell.org/manuscript/robert-lee-furloughs-jewish-soldiers/" target="_blank" rel="noopener">Shapell Manuscript Collection</a>.','en'));}else{if(fig)fig.after(card('הערת שדה · יהודי בקו האש','בשנת 1862 פרסם <em>The Jewish Messenger</em> מחדש סיפור על חייל יהודי הולנדי בווטרלו שקרא “שמע ישראל” בכל פעם שירה, מחשש שיהודי אחר ייפגע מאש נשקו. הפצת הסיפור בזמן מלחמת האזרחים מלמדת על דמיון של אחווה יהודית החוצה קווי קרב.','<a href="https://sites.americanjewisharchives.org/publications/journal/PDF/1961_13_02_00.pdf" target="_blank" rel="noopener">American Jewish Archives</a>.','he'));const p=paraHas(article,'משפחת ג׳ונאס');if(p)p.after(card('הערת שדה · שלושים קברים בריצ׳מונד','בבית העלמין העברי של ריצ׳מונד נמצאת חלקת חיילים נפרדת ובה שלושים חללים יהודים של הקונפדרציה. אגודת הזיכרון של הנשים העבריות החלה לטפל בקברים ב־1866.','<a href="https://www.bethahabah.org/bama/hebrew-cemetery/" target="_blank" rel="noopener">Congregation Beth Ahabah</a>.','he'));const q=paraHas(article,'גם הפולחן היהודי הדרומי');if(q)q.after(card('הערת שדה · לי והימים הנוראים','ב־1861 ביקש מקס מיכלבכר מרוברט א׳ לי חופשה כללית לחיילים יהודים לימים הנוראים. לי דחה חופשה גורפת אך התיר בקשות אישיות. ב־1863 תיעד ל׳ לאון פקודה של לי שאפשרה לכל “Israelite” לנסוע לריצ׳מונד לחגים, והוסיף ביובש: “I did not care to go.”','<a href="https://www.shapell.org/manuscript/robert-lee-furloughs-jewish-soldiers/" target="_blank" rel="noopener">Shapell Manuscript Collection</a>.','he'));}}

function nativeGuard(article,lang){if(!article)return;const figs=[...article.querySelectorAll('figure.archive-figure')];const fig=figs.find(f=>(f.textContent||'').includes(lang==='he'?'החירות הופכת לכוח צבאי':'Freedom becomes military power'));if(!fig)return;const img=fig.querySelector('img');if(img){img.src='https://www.nps.gov/articles/images/2nd-Louisiana-Native-Guard-Company-Formation-on-Ship-Island.jpg';img.alt=lang==='he'?'פלוגה מן הרג׳ימנט השני של Louisiana Native Guard באי Ship Island, 1863.': 'Company formation of the 2nd Louisiana Native Guard on Ship Island, 1863.';img.removeAttribute('data-remote');}const cap=fig.querySelector('.archive-caption');if(cap)cap.innerHTML=lang==='he'?'<strong>בני־צבע חופשיים במדי האיחוד.</strong> פלוגה מן ה־2nd Louisiana Native Guard באי Ship Island, 1863. Gulf Islands National Seashore Collection, National Park Service.':'<strong>Free men of colour in Union blue.</strong> Company formation of the 2nd Louisiana Native Guard on Ship Island, 1863. Gulf Islands National Seashore Collection, National Park Service.';const note=lang==='he'?card('הערת שדה · בני־צבע חופשיים תחת שני דגלים','בשנת 1861 ארגנו בני־צבע חופשיים בניו אורלינס מיליציה בשם Louisiana Native Guard תחת סמכות המדינה והקונפדרציה. נכונותם לשרת לא הפכה את הקונפדרציה לשוויונית מבחינה גזעית: זכויותיהם האזרחיות נותרו מוגבלות והמיליציה לא קיבלה מעמד זהה ליחידות לבנות. לאחר נפילת ניו אורלינס בידי ארצות הברית, אחדים מאותה קהילה הצטרפו ליחידות Native Guard חדשות של צבא האיחוד. הרג׳ימנט השני שבתמונה כלל בתחילה כמעט כולו קצינים בני־צבע, ביצע שמירה ופשיטות, וחלק מאנשיו לחמו נגד כוחות קונפדרטיביים. אותה קהילה יכלה אפוא להופיע תחת שני דגלים, כשהיא מנווטת בין משפחה, רכוש, נאמנות מקומית, הגבלות גזעיות וחורבן העבדות.','מקורות: <a href="https://www.nps.gov/articles/2la-guard.htm" target="_blank" rel="noopener">National Park Service</a>; <a href="https://www.loc.gov/collections/gladstone-african-american-military-collection/articles-and-essays/timeline/" target="_blank" rel="noopener">Library of Congress</a>; <a href="https://lib.lsu.edu/sites/all/files/sc/fpoc/history.html" target="_blank" rel="noopener">LSU Special Collections</a>.','he'):card('Field note · Free men of colour under two flags','In 1861, free men of colour in New Orleans organized a Louisiana Native Guard militia under state and Confederate authority. Their willingness to serve did not make the Confederacy racially egalitarian: their civic rights remained restricted and the militia never received standing equal to white Confederate troops. After New Orleans fell to the United States, some men from the same community entered newly organized Union Native Guard regiments. The 2nd Louisiana Native Guard pictured above initially commissioned nearly all of its company officers from among men of colour, performed guard and raiding duty, and saw combat against Confederate forces. The same community could therefore appear under two flags, navigating family, property, local loyalty, racial restriction, and the destruction of slavery at once.','Sources: <a href="https://www.nps.gov/articles/2la-guard.htm" target="_blank" rel="noopener">National Park Service, Second Louisiana Native Guard</a>; <a href="https://www.loc.gov/collections/gladstone-african-american-military-collection/articles-and-essays/timeline/" target="_blank" rel="noopener">Library of Congress, African American Military Service Timeline</a>; <a href="https://lib.lsu.edu/sites/all/files/sc/fpoc/history.html" target="_blank" rel="noopener">LSU Special Collections, Free People of Color in Louisiana</a>.','en');fig.after(note)}
