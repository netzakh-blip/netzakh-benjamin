const enMarriage=paraHas(enArt,'Benjamin married Natalie St. Martin');if(enMarriage)enMarriage.after(card('Field note · Creole, colour, and slaveholding','“Creole” did not denote a single racial category in antebellum Louisiana. Natalie St. Martin came from a French Catholic Creole family descended from Saint-Domingue refugees; the surviving biographical and marriage-record evidence does <em>not</em> establish her as a free woman of colour. Her marriage settlement did, however, bring Benjamin cash and two enslaved girls. New Orleans also had a substantial community of free people of colour, and some of its members themselves held enslaved people, whether as kin caught inside restrictive manumission law or, in other cases, for household and commercial labour. Louisiana’s three-tiered social world complicated the racial order without dissolving slavery’s coercive line.','Sources: <a href="https://louisiana-anthology.org/303_download/texts/butler--judah_p_benjamin/butler--judah_p_benjamin.html" target="_blank" rel="noopener">Pierce Butler, <em>Judah P. Benjamin</em></a>; <a href="https://digital.library.unt.edu/ark:/67531/metadc5369/m2/1/high_res_d/thesis.pdf" target="_blank" rel="noopener">“Creole Angel,” University of North Texas</a>; <a href="https://www.lib.lsu.edu/sites/all/files/sc/fpoc/fpc-wisdom.pdf" target="_blank" rel="noopener">LSU Special Collections</a>.','en'));
const heMarriage=paraHas(heArt,'בנימין נישא ב־1833 לנטלי סן מרטן');if(heMarriage)heMarriage.after(card('הערת שדה · קריאוליות, צבע ועבדות','המונח “קריאולי” לא ציין קטגוריה גזעית אחת בלואיזיאנה שלפני המלחמה. נטלי סן מרטן באה ממשפחה קריאולית צרפתית וקתולית שמוצאה בפליטי סן־דומנג; המקורות הביוגרפיים ומסמכי הנישואין ששרדו <em>אינם</em> מבססים שהיא הייתה אישה חופשית של צבע. עם זאת, הסכם הנישואין שלה הביא לבנימין כסף ושתי נערות משועבדות. בניו אורלינס התקיימה גם קהילה גדולה של אנשים חופשיים של צבע, וחלק מאנשיה החזיקו בעצמם אנשים משועבדים, לעיתים קרובי משפחה שנלכדו בדיני שחרור מגבילים ולעיתים לצורכי עבודה ביתית ומסחרית. המבנה החברתי התלת־שכבתי של לואיזיאנה סיבך את הסדר הגזעי, אך לא ביטל את הכפייה שעליה נשענה העבדות.','מקורות: <a href="https://louisiana-anthology.org/303_download/texts/butler--judah_p_benjamin/butler--judah_p_benjamin.html" target="_blank" rel="noopener">Pierce Butler, <em>Judah P. Benjamin</em></a>; <a href="https://digital.library.unt.edu/ark:/67531/metadc5369/m2/1/high_res_d/thesis.pdf" target="_blank" rel="noopener">University of North Texas</a>; <a href="https://www.lib.lsu.edu/sites/all/files/sc/fpoc/fpc-wisdom.pdf" target="_blank" rel="noopener">LSU Special Collections</a>.','he'));

function warNotes(article,lang){if(!article)return;const sid=lang==='he'?'he-jewish-americans-in-a-divided-war':'jewish-americans-in-a-divided-war';const fig=firstFigureAfter(doc.getElementById(sid));if(lang==='en'){if(fig)fig.after(card('Field note · A Yehudee in the line of fire','In 1862, <em>The Jewish Messenger</em> retold a story of a Dutch Jewish soldier at Waterloo who cried “Shma Israel” whenever he fired because “it may be some Yehudee gets killed by him.” Its circulation during the American Civil War reveals an imagined Jewish fraternity crossing battle lines.','<a href="https://sites.americanjewisharchives.org/publications/journal/PDF/1961_13_02_00.pdf" target="_blank" rel="noopener">American Jewish Archives reprint of <em>The Jewish Messenger</em>, 7 February 1862</a>.','en'));const p=paraHas(article,'The Jonas family illustrated');if(p)p.after(card('Field note · Thirty graves in Richmond','Richmond’s Hebrew Cemetery contains a separately enclosed Soldiers’ Section with thirty Jewish Confederate dead. The Hebrew Ladies’ Memorial Association began caring for the graves in 1866.','<a href="https://www.bethahabah.org/bama/hebrew-cemetery/" target="_blank" rel="noopener">Congregation Beth Ahabah</a>.','en'));const q=paraHas(article,'Southern Jewish worship also adapted');if(q)q.after(card('Field note · Lee and the High Holy Days','In 1861 Max Michelbacher asked Robert E. Lee for a general furlough for Jewish soldiers during the High Holy Days. Lee declined blanket leave but allowed individual applications. In 1863 L. Leon recorded a Lee order allowing each “Israelite” to go to Richmond for the holidays, adding dryly: “I did not care to go.”','<a href="https://www.shapell.org/manuscript/robert-lee-furloughs-jewish-soldiers/" target="_blank" rel="noopener">Shapell Manuscript Collection</a>.','en'));}else{if(fig)fig.after(card('הערת שדה · יהודי בקו האש','בשנת 1862 פרסם <em>The Jewish Messenger</em> מחדש סיפור על חייל יהודי הולנדי בווטרלו שקרא “שמע ישראל” בכל פעם שירה, מחשש שיהודי אחר ייפגע מאש נשקו. הפצת הסיפור בזמן מלחמת האזרחים מלמדת על דמיון של אחווה יהודית החוצה קווי קרב.','<a href="https://sites.americanjewisharchives.org/publications/journal/PDF/1961_13_02_00.pdf" target="_blank" rel="noopener">American Jewish Archives</a>.','he'));const p=paraHas(article,'משפחת ג׳ונאס');if(p)p.after(card('הערת שדה · שלושים קברים בריצ׳מונד','בבית העלמין העברי של ריצ׳מונד נמצאת חלקת חיילים נפרדת ובה שלושים חללים יהודים של הקונפדרציה. אגודת הזיכרון של הנשים העבריות החלה לטפל בקברים ב־1866.','<a href="https://www.bethahabah.org/bama/hebrew-cemetery/" target="_blank" rel="noopener">Congregation Beth Ahabah</a>.','he'));const q=paraHas(article,'גם הפולחן היהודי הדרומי');if(q)q.after(card('הערת שדה · לי והימים הנוראים','ב־1861 ביקש מקס מיכלבכר מרוברט א׳ לי חופשה כללית לחיילים יהודים לימים הנוראים. לי דחה חופשה גורפת אך התיר בקשות אישיות. ב־1863 תיעד ל׳ לאון פקודה של לי שאפשרה לכל “Israelite” לנסוע לריצ׳מונד לחגים, והוסיף ביובש: “I did not care to go.”','<a href="https://www.shapell.org/manuscript/robert-lee-furloughs-jewish-soldiers/" target="_blank" rel="noopener">Shapell Manuscript Collection</a>.','he'));}}
