if(enArt){const sec=doc.getElementById('jewish-americans-in-a-divided-war'),fig=firstFigureAfter(sec);if(fig)fig.after(card('Field note · A Yehudee in the line of fire','A Civil War-era Jewish story, but not a Confederate battlefield anecdote.  In 1862, <em>The Jewish Messenger</em> printed a correspondent’s retelling of a Dutch Jewish soldier at Waterloo who cried “Shma Israel” whenever he fired because “it may be some Yehudee gets killed by him.”  Its circulation during the American Civil War is revealing: readers imagined Jewish fraternity crossing national battle lines even while American Jews fought on both sides.','Source: <a href="https://sites.americanjewisharchives.org/publications/journal/PDF/1961_13_02_00.pdf" target="_blank" rel="noopener">American Jewish Archives reprint of <em>The Jewish Messenger</em>, 7 February 1862</a>.','en'));const jp=paraStarting(enArt,'The Jonas family illustrated');if(jp)jp.after(card('Field note · Thirty graves in Richmond','Richmond’s Hebrew Cemetery contains a separately enclosed Soldiers’ Section with thirty Jewish Confederate dead who died in or near the city.  Congregation Beth Ahabah calls it the only Jewish military cemetery in the United States and one of very few outside Israel; it is often described as one of only two outside Israel, alongside the First World War Jewish military cemetery at Weissensee in Berlin.  The Hebrew Ladies’ Memorial Association began caring for the graves in 1866 and commissioned the extraordinary iron fence of rifles, sabres, and soldiers’ caps.','Sources: <a href="https://www.bethahabah.org/bama/hebrew-cemetery/" target="_blank" rel="noopener">Congregation Beth Ahabah, Hebrew Cemetery</a>; <a href="https://architecturerichmond.com/inventory/hebrew-cemetery/" target="_blank" rel="noopener">Architecture Richmond</a>.','en'));const gp=paraStarting(enArt,'Southern Jewish worship also adapted');if(gp)gp.after(card('Field note · Lee and the High Holy Days','On 23 August 1861, Max Michelbacher of Richmond’s Beth Ahabah asked Robert E. Lee for a general furlough so Jewish soldiers could attend High Holy Day services.  Lee refused blanket leave but allowed individual applications, hoping many could “enjoy the privilege you seek.”  Two years later, Jewish Confederate private L. Leon recorded that an order from Lee granted leave to each “Israelite” who wished to go to Richmond for the holidays.  Leon’s verdict was gloriously prosaic: “I did not care to go.”','Sources: <a href="https://www.shapell.org/manuscript/robert-lee-furloughs-jewish-soldiers/" target="_blank" rel="noopener">Lee to Max Michelbacher, 29 August 1861, Shapell Manuscript Collection</a>; <a href="https://antietaminstitute.org/hrc/files/original/2ff95538755d201642daee0a8aa26c5f6cff9c03.pdf" target="_blank" rel="noopener">L. Leon, <em>Diary of a Tar Heel Confederate Soldier</em> (1913), 48</a>.','en'));}
if(heArt){const sec=doc.getElementById('he-jewish-americans-in-a-divided-war'),fig=firstFigureAfter(sec);if(fig)fig.after(card('הערת שדה · יהודי בקו האש','זהו סיפור יהודי מתקופת מלחמת האזרחים, אבל לא אנקדוטה משדה קרב קונפדרטיבי.  בשנת 1862 הדפיס <em>The Jewish Messenger</em> סיפור שסופר מפי כתב על חייל יהודי הולנדי בקרב ווטרלו.  בכל פעם שירה קרא “שמע ישראל”, מחשש ש־“it may be some Yehudee gets killed by him”.  עצם הפצת הסיפור בזמן מלחמת האזרחים האמריקאית מעניינת במיוחד: הקוראים דמיינו אחווה יהודית החוצה קווי מלחמה לאומיים בזמן שיהודים אמריקאים עצמם לחמו משני הצדדים.','מקור: <a href="https://sites.americanjewisharchives.org/publications/journal/PDF/1961_13_02_00.pdf" target="_blank" rel="noopener">הדפסה מחדש ב־<em>American Jewish Archives</em> מתוך <em>The Jewish Messenger</em>, ‏7 בפברואר 1862</a>.','he'));const jp=paraStarting(heArt,'משפחת ג׳ונאס המחישה');if(jp)jp.after(card('הערת שדה · שלושים קברים בריצ׳מונד','בבית העלמין העברי של ריצ׳מונד נמצא “חלקת החיילים”, מתחם נפרד ובו שלושים חיילים יהודים של הקונפדרציה שמתו בעיר או בסביבתה.  קהילת Beth Ahabah מתארת אותה כבית העלמין הצבאי היהודי היחיד בארצות הברית וכאחד המעטים מחוץ לישראל; מקורות אחרים מתארים אותה כאחד משני בתי עלמין צבאיים יהודיים בלבד מחוץ לישראל, לצד בית העלמין הצבאי היהודי ממלחמת העולם הראשונה בווייסנזה שבברלין.  אגודת הזיכרון של הנשים העבריות החלה לטפל בקברים ב־1866 והזמינה את גדר הברזל החריגה המעוטרת ברובים, חרבות וכובעי חיילים.','מקורות: <a href="https://www.bethahabah.org/bama/hebrew-cemetery/" target="_blank" rel="noopener">Congregation Beth Ahabah, Hebrew Cemetery</a>; <a href="https://architecturerichmond.com/inventory/hebrew-cemetery/" target="_blank" rel="noopener">Architecture Richmond</a>.','he'));const gp=paraStarting(heArt,'גם הפולחן היהודי הדרומי');if(gp)gp.after(card('הערת שדה · לי והימים הנוראים','ב־23 באוגוסט 1861 ביקש מקס מיכלבכר מקהילת Beth Ahabah בריצ׳מונד מרוברט א׳ לי חופשה כללית לחיילים יהודים כדי שיוכלו להשתתף בתפילות הימים הנוראים.  לי סירב לחופשה גורפת, אך התיר בקשות אישיות וקיווה שרבים יוכלו “enjoy the privilege you seek”.  שנתיים לאחר מכן רשם הטוראי היהודי הקונפדרטי ל׳ לאון כי פקודה של לי העניקה חופשה לכל “Israelite” שרצה לנסוע לריצ׳מונד לחגים.  תגובתו של לאון הייתה יבשה להפליא: “I did not care to go.”','מקורות: <a href="https://www.shapell.org/manuscript/robert-lee-furloughs-jewish-soldiers/" target="_blank" rel="noopener">לי למקס מיכלבכר, 29 באוגוסט 1861, Shapell Manuscript Collection</a>; <a href="https://antietaminstitute.org/hrc/files/original/2ff95538755d201642daee0a8aa26c5f6cff9c03.pdf" target="_blank" rel="noopener">L. Leon, <em>Diary of a Tar Heel Confederate Soldier</em> (1913), עמ׳ 48</a>.','he'));}
