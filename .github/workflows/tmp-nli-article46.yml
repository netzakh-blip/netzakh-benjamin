name: Temporary NLI article 46 retrieval

on:
  push:
    branches:
      - tmp-nli-article46
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Fetch article blocks in parallel
        shell: bash
        run: |
          set -u
          mkdir -p out/direct out/proxy
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          ARTICLE='dwt19070730-01.2.46'
          PAGE='dwt19070730-01.1.5'
          ISSUE='dwt19070730-01'
          export UA ARTICLE PAGE ISSUE

          fetch_area() {
            area="$1"; mode="$2"
            if [ "$mode" = direct ]; then
              url="https://www.nli.org.il/en/newspapers/?a=is&oid=${ARTICLE}&type=blockimage&area=${area}&width=5000"
            else
              url="https://www-nli-org-il.translate.goog/en/newspapers/?a=is&oid=${ARTICLE}&type=blockimage&area=${area}&width=5000&_x_tr_sl=auto&_x_tr_tl=en&_x_tr_hl=en-US"
            fi
            dest="out/${mode}/area_${area}.bin"
            code=$(curl -L -sS --retry 1 --connect-timeout 8 --max-time 25 -A "$UA" -w '%{http_code}' -o "$dest" "$url" || true)
            printf '%s\t%s\t%s\t%s\t%s\n' "$mode" "$area" "$code" "$(stat -c%s "$dest" 2>/dev/null || echo 0)" "$(file -b --mime-type "$dest" 2>/dev/null || true)" > "out/${mode}/area_${area}.tsv"
          }
          export -f fetch_area

          seq 0 50 | xargs -I{} -P 16 bash -c 'fetch_area "$1" direct' _ {}
          seq 0 50 | xargs -I{} -P 16 bash -c 'fetch_area "$1" proxy' _ {}

          fetch_extra() {
            url="$1"; dest="$2"
            code=$(curl -L -sS --retry 1 --connect-timeout 8 --max-time 35 -A "$UA" -w '%{http_code}' -o "$dest" "$url" || true)
            printf '%s\t%s\t%s\t%s\n' "$code" "$(stat -c%s "$dest" 2>/dev/null || echo 0)" "$(file -b --mime-type "$dest" 2>/dev/null || true)" "$url" >> out/extras.tsv
          }
          printf 'http\tbytes\tmime\turl\n' > out/extras.tsv
          fetch_extra "https://www.nli.org.il/en/newspapers/?a=d&d=${ARTICLE}&f=XML" out/direct/article.xml
          fetch_extra "https://www-nli-org-il.translate.goog/en/newspapers/?a=d&d=${ARTICLE}&f=XML&_x_tr_sl=auto&_x_tr_tl=en&_x_tr_hl=en-US" out/proxy/article.xml
          fetch_extra "https://www.nli.org.il/en/newspapers/?a=is&oid=${ARTICLE}&type=blockimage&width=5000" out/direct/article_no_area.bin
          fetch_extra "https://www-nli-org-il.translate.goog/en/newspapers/?a=is&oid=${ARTICLE}&type=blockimage&width=5000&_x_tr_sl=auto&_x_tr_tl=en&_x_tr_hl=en-US" out/proxy/article_no_area.bin
          fetch_extra "https://www.nli.org.il/en/newspapers/?a=is&oid=${PAGE}&type=pageimage&width=5000" out/direct/page5.bin
          fetch_extra "https://www-nli-org-il.translate.goog/en/newspapers/?a=is&oid=${PAGE}&type=pageimage&width=5000&_x_tr_sl=auto&_x_tr_tl=en&_x_tr_hl=en-US" out/proxy/page5.bin
          fetch_extra "https://www.nli.org.il/en/newspapers/?a=is&oid=${ISSUE}&type=staticpdf" out/direct/issue.bin
          fetch_extra "https://www-nli-org-il.translate.goog/en/newspapers/?a=is&oid=${ISSUE}&type=staticpdf&_x_tr_sl=auto&_x_tr_tl=en&_x_tr_hl=en-US" out/proxy/issue.bin

          {
            echo -e 'mode\tarea\thttp\tbytes\tmime'
            cat out/direct/area_*.tsv out/proxy/area_*.tsv | sort -k1,1 -k2,2n
            echo
            echo '=== EXTRAS ==='
            cat out/extras.tsv
            echo
            echo '=== HASHES OF IMAGE RESPONSES ==='
            find out -type f -name '*.bin' -print0 | xargs -0 -r file --mime-type | grep -E 'image/(jpeg|png)|application/pdf' || true
            find out -type f -name '*.bin' -print0 | xargs -0 -r sha256sum || true
            echo
            echo '=== KEYWORD HITS IN TEXT RESPONSES ==='
            grep -RaniE 'פארווערט|פאָרווערט|Forvert|Forward|ראטנער|Ratner' out 2>/dev/null || true
          } > out/result.txt

      - name: Upload retrieval corpus
        uses: actions/upload-artifact@v4
        with:
          name: nli-article46-fast
          path: out
          if-no-files-found: error
          retention-days: 1
